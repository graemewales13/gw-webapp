# Deploys the infrastructure when infra/ changes on main. Run it by hand to
# apply, or to destroy everything (the app is ephemeral: rebuild it with a
# normal apply). Nonprod only for now; prod is added as a second job (its
# environment needs approval).
name: infra-cd

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra-cd*.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: "apply, or destroy everything in the environment"
        type: choice
        options: [apply, destroy]
        default: apply

permissions:
  contents: read

jobs:
  nonprod:
    name: nonprod
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/infra-cd-template.yml
    with:
      environment: nonprod
      destroy: ${{ inputs.action == 'destroy' }}
