# Checks for every pull request. Terraform plans and applies run in
# infra-cd.yml from main; a plan on pull requests comes in a later change.
#
# Actions are pinned to full commit SHAs (tag in the comment).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.16.5"
  TFLINT_VERSION: "v0.64.0"
  CHECKOV_VERSION: "3.3.28"
  ANSIBLE_LINT_VERSION: "26.9.0"
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --chdir=infra --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  checkov:
    name: checkov (Terraform + Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check "checkov==${CHECKOV_VERSION}"
      # Deliberate exceptions are documented inline with #checkov:skip=<id>:<reason>
      - run: checkov -d . --framework terraform dockerfile --compact --quiet --skip-download

  ansible:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check "ansible-lint==${ANSIBLE_LINT_VERSION}"
      - run: ansible-lint site.yml
        working-directory: ansible

  api:
    name: api (byte-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12" # Ubuntu 24.04's Python, as on the VM
      - run: pip install --disable-pip-version-check -r api/requirements.txt
      - run: python -m compileall -q api

  frontend:
    name: frontend (docker build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --pull -t frontend:ci frontend
