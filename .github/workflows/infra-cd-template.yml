# Plans one environment's infrastructure (or its destruction), then applies
# that exact plan. Both jobs run in the GitHub environment of the same name,
# so they sign in as that landing zone's deploy identity (OIDC, no secrets)
# and use its state account. The environment only allows main.
name: infra-cd-template

on:
  workflow_call:
    inputs:
      environment:
        description: "nonprod or prod: matches infra/environments/<name>.tfvars"
        required: true
        type: string
      destroy:
        description: "Plan and apply the destruction of everything instead"
        default: false
        type: boolean
      terraform_version:
        default: "1.16.5"
        type: string

env:
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_USE_AZUREAD: true
  ARM_USE_OIDC: true
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: plan ${{ inputs.environment }}
    runs-on: ubuntu-latest
    concurrency: tfstate-${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.BACKEND_AZURE_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME }}" \
            -backend-config="key=${{ inputs.environment }}.tfstate"

      # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes. Apply only
      # runs when there is something to change.
      - name: terraform plan
        id: plan
        run: |
          set +e
          # shellcheck disable=SC2086
          terraform plan -input=false -out=tfplan -detailed-exitcode \
            -var-file="environments/${{ inputs.environment }}.tfvars" \
            ${{ inputs.destroy && '-destroy' || '' }}
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then exit 1; fi
          echo "has_changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: show plan
        run: terraform show -no-color tfplan

      # The apply job uses this exact plan.
      - name: publish plan
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-${{ inputs.environment }}
          include-hidden-files: true # .terraform.lock.hcl
          retention-days: 1
          path: |
            infra
            !infra/.terraform/**

  apply:
    name: ${{ inputs.destroy && 'destroy' || 'apply' }} ${{ inputs.environment }}
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    concurrency: tfstate-${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plan-${{ inputs.environment }}
          path: infra

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.BACKEND_AZURE_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME }}" \
            -backend-config="key=${{ inputs.environment }}.tfstate"

      - name: azure login
        if: inputs.destroy
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The landing zone's Deploy-VM-Backup policy puts a Recovery Services
      # vault in the app's resource group and protects the VM. Terraform
      # doesn't manage it, and a vault holding backups can't be deleted, so
      # the resource group couldn't be either. Remove the backups (no soft
      # delete: this environment is ephemeral) and the vault first.
      - name: remove policy-created backup vaults
        if: inputs.destroy
        run: |
          rg=$(terraform output -raw resource_group_name 2>/dev/null || true)
          if [ -z "$rg" ] || ! az group exists --name "$rg" | grep -q true; then
            echo "No resource group to clean up."; exit 0
          fi
          for vault in $(az resource list --resource-group "$rg" \
                           --resource-type Microsoft.RecoveryServices/vaults --query "[].name" -o tsv); do
            echo "Vault $vault"
            az backup vault backup-properties set --resource-group "$rg" --name "$vault" \
              --soft-delete-feature-state Disable --output none
            az backup item list --resource-group "$rg" --vault-name "$vault" -o json \
              | jq -r '.[] | "\(.properties.containerName) \(.name)"' \
              | while read -r container item; do
                  echo "  stopping backup and deleting data for $item"
                  az backup protection disable --resource-group "$rg" --vault-name "$vault" \
                    --container-name "$container" --item-name "$item" \
                    --backup-management-type AzureIaasVM --delete-backup-data true --yes --output none
                done
            az backup vault delete --resource-group "$rg" --name "$vault" --force --yes
          done

      - name: terraform ${{ inputs.destroy && 'destroy' || 'apply' }}
        run: terraform apply -input=false -auto-approve tfplan
